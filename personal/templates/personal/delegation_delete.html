<!-- personal/templates/personal/delegation_confirm_delete.html -->
{% extends "base.html" %}

{% block title %}Delete Delegation{% endblock %}

{% block content %}
<h1>Delete "{{ object.name }}"?</h1>
<p>This action cannot be undone.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger" href="{% url 'delegation_list' %}">Yes, delete</button>
    <a href="{% url 'delegation_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
