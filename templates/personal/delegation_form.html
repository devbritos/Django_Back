{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{% if object %}Editar{% else %}Nueva{% endif %} delegación — SGR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-municipal text-white py-3">
                <h1 class="h5 mb-0">{% if object %}Editar{% else %}Nueva{% endif %} delegación</h1>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{% url 'personal:delegation_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar delegación</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
