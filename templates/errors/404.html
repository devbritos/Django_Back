{% extends "base.html" %}

{% block title %}Página no encontrada — SGR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0">
            <div class="card-body text-center p-5">
                <i class="bi bi-exclamation-triangle text-warning display-3" aria-hidden="true"></i>
                <p class="text-warning fw-bold mt-3 mb-1">Error 404</p>
                <h1 class="h3 mb-3">No encontramos esta página</h1>
                <p class="text-muted mb-4">
                    Es posible que la dirección haya cambiado o que la página ya no exista.
                </p>
                <button class="btn btn-primary" type="button"
                        onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.assign('{% url 'dashboard_redirect' %}'); }">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                    Volver a la página anterior
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
