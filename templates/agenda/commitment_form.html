{% extends "base.html" %}
{% block content %}
<h2>{% if object %}Editar{% else %}Nuevo{% endif %} compromiso</h2>
<form method="post" id="modal-form-content">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'agenda:commitment_list' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
