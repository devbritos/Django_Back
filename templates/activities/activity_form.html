{% extends "base.html" %}
{% block content %}
<h2>{% if object %}Editar{% else %}Nueva{% endif %} actividad</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'activities:activity_list' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
