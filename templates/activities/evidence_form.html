{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Subir evidencia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9 col-lg-7">
        <div class="card border-0 shadow-sm form-card">
            <div class="card-header bg-municipal text-white py-3">
                <h1 class="h5 mb-0"><i class="bi bi-file-earmark-arrow-up me-2"></i>Subir evidencia</h1>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{% url 'activities:evidence_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-cloud-arrow-up me-1"></i>Guardar evidencia
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
