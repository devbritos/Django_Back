{% extends "base.html" %}
{% block content %}
<h2>Subir evidencia</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'activities:evidence_list' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
