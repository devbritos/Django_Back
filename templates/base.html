{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SGR{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Color ajustado exactamente al rojo de la imagen del logo */
        .bg-municipal {
            background-color: #9e2a2b !important; 
        }
        
        .navbar-brand-logo {
            height: 48px;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-municipal shadow-sm">
        <div class="container">
            <!-- Logo integrado en la esquina izquierda -->
            <a class="navbar-brand d-flex align-items-center me-4" href="{% url 'personal:functionary_list' %}">
                <img src="{% static 'images/faroletras.png' %}" alt="Logo SGR" class="navbar-brand-logo">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="{% url 'personal:functionary_list' %}">Funcionarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="{% url 'personal:delegation_list' %}">Delegaciones</a>
                    </li>
                </ul>

                {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center m-0">
                    {% csrf_token %}
                    <span class="text-white-50 me-2 small">Conectado como <strong>{{ user.username }}</strong></span>
                    <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
                </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
