<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SGR{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'personal:functionary_list' %}">SGR</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'personal:functionary_list' %}">Funcionarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'personal:delegation_list' %}">Delegaciones</a>
                    </li>
                </ul>

                {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}" class="ms-auto">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Salir ({{ user.username }})</button>
                </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
