{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Editar{% else %}Nuevo{% endif %} ítem{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
    <div class="card shadow-sm"><div class="card-header bg-municipal text-white"><h1 class="h5 mb-0">{% if object %}Editar{% else %}Nuevo{% endif %} ítem de medición</h1></div>
        <div class="card-body"><form method="post">{% csrf_token %}{{ form|crispy }}
            <div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{% url 'configuration:measuring_list' %}">Cancelar</a><button class="btn btn-primary">Guardar</button></div>
        </form></div>
    </div>
</div></div>
{% endblock %}
